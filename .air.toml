root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/gophermart"
entrypoint = ["./tmp/main"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "deployments", "build"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
log = "air.log"
stop_on_error = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
